<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Timer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #c9d1d9;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 520px;
      padding: 20px;
    }

    .settings-toggle {
      background: none;
      border: none;
      color: #484f58;
      font-size: 1.6rem;
      cursor: pointer;
      transition: transform 0.3s, color 0.2s;
      float: right;
      margin-bottom: 10px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .settings-toggle:hover {
      color: #58a6ff;
      transform: rotate(45deg);
    }

    .settings-panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: left;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .settings-panel label {
      display: block;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .settings-panel input[type="number"] {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 5px 8px;
      width: 60px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .settings-panel input[type="number"]:focus {
      border-color: #58a6ff;
    }

    .settings-panel .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .settings-panel .row input[type="number"] {
      width: 50px;
    }

    .settings-panel .hint {
      font-size: 0.75rem;
      color: #484f58;
      margin-top: 2px;
    }

    .display {
      font-size: 7rem;
      font-weight: 200;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      color: #e6edf3;
      margin: 10px 0 30px;
      line-height: 1;
      transition: color 0.3s;
    }
    .display.urgent {
      color: #f0883e;
    }
    .display.critical {
      color: #f85149;
    }
    .display.alarm {
      color: #f85149;
      animation: blink 0.5s ease-in-out infinite alternate;
    }

    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.3; }
    }

    .presets {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
      min-height: 44px;
    }

    .preset-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.15s;
      min-width: 64px;
    }
    .preset-btn:hover {
      background: #30363d;
      border-color: #58a6ff;
      color: #58a6ff;
      transform: translateY(-1px);
    }
    .preset-btn:active {
      transform: translateY(0);
    }
    .preset-btn.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 30px;
    }

    .slider-label {
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 1.1rem;
      color: #58a6ff;
      min-width: 50px;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #21262d;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #58a6ff;
      cursor: pointer;
      border: 3px solid #0d1117;
      box-shadow: 0 0 6px rgba(88,166,255,0.3);
      transition: transform 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #58a6ff;
      cursor: pointer;
      border: 3px solid #0d1117;
    }

    .stop-btn {
      background: #da3633;
      border: none;
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      opacity: 0;
      pointer-events: none;
    }
    .stop-btn.visible {
      opacity: 1;
      pointer-events: all;
    }
    .stop-btn:hover {
      background: #f85149;
      transform: scale(1.03);
    }

    .alarm-text {
      font-size: 1.2rem;
      color: #f85149;
      font-weight: 600;
      height: 30px;
      line-height: 30px;
      margin-bottom: 10px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .alarm-text.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="settings-toggle" title="Configuraci&oacute;n">&#9881;</button>
    <div class="settings-panel" id="settingsPanel" hidden>
      <label>
        Cantidad de presets (3-10)
        <input type="number" id="presetCount" min="3" max="10" value="5">
      </label>
      <label>
        Valores (minutos)
        <div class="row" id="presetInputs"></div>
      </label>
      <label>
        Slider m&aacute;ximo (minutos)
        <input type="number" id="sliderMax" min="1" max="300" value="30">
      </label>
      <div class="hint">Se guarda autom&aacute;ticamente al cerrar.</div>
    </div>

    <div class="display" id="display">00:00</div>
    <div class="alarm-text" id="alarmText">TIME'S UP</div>

    <div class="presets" id="presets"></div>

    <div class="slider-wrap">
      <input type="range" id="slider" min="60" max="1800" value="300" step="60">
      <div class="slider-label" id="sliderLabel">5:00</div>
    </div>

    <button class="stop-btn" id="stopBtn">Stop</button>
  </div>

  <script>
    const LS_KEY = 'easy_timer_cfg';

    const defaults = { presets: [1, 3, 5, 10, 15], sliderMax: 30 };

    let cfg = loadCfg();
    let timerTotal = 0;
    let timerRemain = 0;
    let timerInterval = null;
    let audioCtx = null;

    const $ = s => document.querySelector(s);
    const $display = $('#display');
    const $presets = $('#presets');
    const $slider = $('#slider');
    const $sliderLabel = $('#sliderLabel');
    const $stopBtn = $('#stopBtn');
    const $settingsPanel = $('#settingsPanel');
    const $settingsToggle = $('.settings-toggle');
    const $alarmText = $('#alarmText');
    const $presetCount = $('#presetCount');
    const $sliderMax = $('#sliderMax');
    const $presetInputs = $('#presetInputs');

    function loadCfg() {
      try {
        const d = JSON.parse(localStorage.getItem(LS_KEY));
        if (d && Array.isArray(d.presets) && d.sliderMax) return d;
      } catch {}
      return { ...defaults };
    }

    function saveCfg() {
      localStorage.setItem(LS_KEY, JSON.stringify(cfg));
    }

    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function fmtM(m) {
      const mm = Math.floor(m);
      const ss = Math.round((m - mm) * 60);
      return String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    }

    function updateDisplay() {
      $display.textContent = fmt(timerRemain);
      $display.className = 'display';
      if (timerRemain <= 3 && timerRemain > 0) $display.className += ' critical';
      else if (timerRemain <= 10 && timerRemain > 0) $display.className += ' urgent';
    }

    // ── Audio ──

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function beep(freq, startAt, dur) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.frequency.value = freq;
      o.type = 'sine';
      g.gain.setValueAtTime(0.3, audioCtx.currentTime + startAt);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startAt + dur);
      o.start(audioCtx.currentTime + startAt);
      o.stop(audioCtx.currentTime + startAt + dur);
    }

    function scheduleBeeps(totalSecs) {
      ensureAudio();
      for (let t = 0; t < totalSecs; t++) beep(880, t, 0.1);
    }

    function scheduleUrgent(totalSecs) {
      ensureAudio();
      for (let t = 0; t < totalSecs; t++) {
        beep(1100, t, 0.08);
        beep(1300, t + 0.12, 0.08);
      }
    }

    function scheduleCritical(totalSecs) {
      ensureAudio();
      for (let t = 0; t < totalSecs; t++) {
        beep(1500, t, 0.06);
        beep(1700, t + 0.08, 0.06);
        beep(1900, t + 0.16, 0.06);
      }
    }

    function scheduleAlarm() {
      ensureAudio();
      const dur = 6;
      for (let t = 0; t < dur; t += 0.3) {
        beep(2000, t, 0.1);
        beep(1600, t + 0.12, 0.1);
      }
    }

    // ── Timer ──

    function startTimer(secs) {
      stopTimer();
      timerTotal = secs;
      timerRemain = secs;
      updateDisplay();

      timerInterval = setInterval(() => {
        timerRemain--;
        updateDisplay();
        if (timerRemain === 10) scheduleBeeps(10);
        else if (timerRemain === 5) scheduleUrgent(5);
        else if (timerRemain === 3) scheduleCritical(3);

        if (timerRemain <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          timerRemain = 0;
          updateDisplay();
          $display.className = 'display alarm';
          $alarmText.classList.add('visible');
          $stopBtn.classList.add('visible');
          scheduleAlarm();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      $display.className = 'display';
      $alarmText.classList.remove('visible');
      $stopBtn.classList.remove('visible');
    }

    // ── UI ──

    function renderPresets() {
      $presets.innerHTML = '';
      const half = Math.ceil(cfg.presets.length / 2);
      let row1 = cfg.presets.slice(0, half);
      let row2 = cfg.presets.slice(half);

      row1.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn';
        btn.textContent = m >= 60 ? (m / 60) + 'h' : m + 'm';
        btn.onclick = () => startTimer(m * 60);
        $presets.appendChild(btn);
      });

      if (row2.length) {
        row2.forEach(m => {
          const btn = document.createElement('button');
          btn.className = 'preset-btn';
          btn.textContent = m >= 60 ? (m / 60) + 'h' : m + 'm';
          btn.onclick = () => startTimer(m * 60);
          $presets.appendChild(btn);
        });
      }
    }

    function renderSlider() {
      $slider.min = 60;
      $slider.max = cfg.sliderMax * 60;
      $slider.step = 60;
      $slider.value = Math.min(parseInt($slider.value) || 300, $slider.max);
      $sliderLabel.textContent = fmtM($slider.value / 60);
    }

    function renderSettingsInputs() {
      $presetCount.value = cfg.presets.length;
      $sliderMax.value = cfg.sliderMax;
      $presetInputs.innerHTML = '';
      cfg.presets.forEach((v, i) => {
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.min = 1;
        inp.max = 300;
        inp.value = v;
        inp.className = 'preset-input';
        $presetInputs.appendChild(inp);
      });
    }

    // ── Settings panel ──

    $settingsToggle.addEventListener('click', () => {
      const open = $settingsPanel.hidden;
      $settingsPanel.hidden = !open;
      if (open) renderSettingsInputs();
    });

    $presetCount.addEventListener('input', () => {
      let n = parseInt($presetCount.value);
      if (n < 3) n = 3;
      if (n > 10) n = 10;
      while (cfg.presets.length < n) cfg.presets.push(cfg.presets[cfg.presets.length - 1] + 1);
      while (cfg.presets.length > n) cfg.presets.pop();
      renderSettingsInputs();
    });

    $settingsPanel.addEventListener('focusout', () => {
      const inputs = [...$presetInputs.querySelectorAll('input')];
      cfg.presets = inputs.map(i => Math.max(1, parseInt(i.value) || 1));
      cfg.sliderMax = Math.max(1, parseInt($sliderMax.value) || 30);
      saveCfg();
      renderPresets();
      renderSlider();
    });

    // ── Events ──

    let sliderDebounce = null;
    $slider.addEventListener('input', () => {
      $sliderLabel.textContent = fmtM($slider.value / 60);
      clearTimeout(sliderDebounce);
      sliderDebounce = setTimeout(() => {
        startTimer(parseInt($slider.value));
      }, 80);
    });

    $stopBtn.addEventListener('click', () => {
      stopTimer();
      renderPresets();
      renderSlider();
    });

    // ── Init ──
    renderPresets();
    renderSlider();
  </script>
</body>
</html>
